{% extends "base.html" %}

{% block title %}Change Password - Cloud Kitchen{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🔐</div>
            <h2 class="text-3xl font-bold text-gray-900">Change Your Password</h2>
            <p class="mt-2 text-gray-600">This is your first login. For security, please set a new password.</p>
        </div>

        <!-- Change Password Form -->
        <div class="bg-white rounded-lg shadow-md p-8">
            <form id="change-password-form" onsubmit="handleChangePassword(event)">
                <!-- Current Password (Optional, but good for verification if we use the default) -->
                <div class="mb-4">
                    <label for="current-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Current Password
                    </label>
                    <input
                        type="password"
                        id="current-password"
                        name="current-password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                        placeholder="Default password given by admin"
                    >
                </div>

                <!-- New Password -->
                <div class="mb-4">
                    <label for="new-password" class="block text-sm font-medium text-gray-700 mb-2">
                        New Password
                    </label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                        placeholder="Minimum 8 characters"
                    >
                </div>

                <!-- Confirm New Password -->
                <div class="mb-6">
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm New Password
                    </label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                        placeholder="Repeat new password"
                    >
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-sm text-red-600"></p>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full px-6 py-3 bg-orange-600 text-white font-semibold rounded-lg hover:bg-orange-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Change Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleChangePassword(event) {
    event.preventDefault();

    const currentPassword = document.getElementById('current-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');

    // Hide previous errors
    errorMessage.classList.add('hidden');

    // Validate
    if (newPassword !== confirmPassword) {
        showError("New passwords do not match");
        return;
    }

    if (newPassword.length < 8) {
        showError("Password must be at least 8 characters");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
        await api.request('/auth/change-password', {
            method: 'POST',
            body: JSON.stringify({
                current_password: currentPassword,
                new_password: newPassword
            })
        });

        showToast('Password updated successfully!', 'success');
        
        // Update stored user info
        const user = api.getCurrentUser();
        if (user) {
            user.requires_password_change = false;
            localStorage.setItem('user', JSON.stringify(user));
        }

        setTimeout(() => {
            if (user.role === 'staff' || user.role === 'admin') {
                window.location.href = '/staff';
            } else {
                window.location.href = '/menu';
            }
        }, 1500);

    } catch (error) {
        showError(error.message || 'Failed to update password');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Change Password';
    }
}

function showError(message) {
    const errorMessage = document.getElementById('error-message');
    errorMessage.querySelector('p').textContent = message;
    errorMessage.classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded', () => {
    const user = api.getCurrentUser();
    if (!user) {
        window.location.href = '/login';
    }
});
</script>
{% endblock %}
